<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .catalogo {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .filme {
            background-color: #222;
            border-radius: 10px;
            width: 200px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .filme img {
            width: 100%;
            border-radius: 10px;
        }

        .filme h3 {
            margin: 10px 0 5px;
        }

        .filme p {
            font-size: 14px;
        }

        .filme a {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            background-color: red;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>🎬 Catálogo de Filmes</h1>
    <p>Escolha um filme para assistir!</p>

    <div class="catalogo">

        <div class="filme">
            <img src="https://img.elo7.com.br/product/zoom/259A7AA/big-poster-filme-vingadores-ultimato-lo001-tamanho-90x60-cm-poster-marvel.jpg" alt="Vingadores Ultimato">
            <h3>Vingadores: Ultimato</h3>
            <p>Ação | Aventura</p>
            <a href="https://www.youtube.com/watch?v=g6ng8iy-l0U" target="_blank">Assistir Trailer</a>
        </div>

        <div class="filme">
            <img src="https://br.web.img3.acsta.net/pictures/17/05/29/23/31/530814.jpg" alt="Homem-Aranha">
            <h3>Homem-Aranha</h3>
            <p>Ação | Herói</p>
            <a href="https://www.youtube.com/watch?v=rk-dF1lIbIg" target="_blank">Assistir Trailer</a>
        </div>

        <div class="filme">
            <img src="https://upload.wikimedia.org/wikipedia/pt/3/3a/Interstellar_Filme.png" alt="Interestelar">
            <h3>Interestelar</h3>
            <p>Ficção Científica</p>
            <a href="https://www.youtube.com/watch?v=zSWdZVtXT7E" target="_blank">Assistir Trailer</a>
        </div>

        <div class="filme">
            <img src="https://m.media-amazon.com/images/M/MV5BODBiMjI5MjctYzU1Zi00ZjkwLTlhNzAtNTJkNTBjNTczMTkwXkEyXkFqcGc@._V1_QL75_UX190_CR0,0,190,281_.jpg" alt="Velozes e Furiosos">
            <h3>Velozes e Furiosos 8</h3>
            <p>Ação | Corrida</p>
            <a href="https://www.youtube.com/watch?v=uisBaTkQAEs" target="_blank">Assistir Trailer</a>
        </div>

    </div>

</body>

</html>
